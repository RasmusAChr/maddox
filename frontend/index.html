<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Math Notebook</title>
  <link rel="stylesheet" href="vendor/katex.min.css">
  <link rel="stylesheet" href="vendor/codemirror.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toolbar">
    <span id="app-title">Math Notebook</span>
    <div id="toolbar-actions">
      <button id="new-btn">New</button>
      <button id="open-btn">Open</button>
      <button id="save-btn">Save</button>
      <button id="run-all-btn" class="primary" title="Ctrl+Shift+Enter">Run All</button>
    </div>
    <span id="status"></span>
  </div>
  <div id="main">
    <aside id="sidebar">
      <div id="sidebar-title">Templates</div>
      <div id="templates"></div>
    </aside>
    <div id="cells"></div>
  </div>

  <script src="vendor/katex.min.js"></script>
  <script src="vendor/codemirror.min.js"></script>
  <script src="vendor/python.min.js"></script>
  <script src="vendor/mathlive/mathlive.min.js"></script>
  <script src="notebook.js"></script>
</body>
</html>
