[package]
name = "maddox"
version = "1.5.2"
description = "A keyboard-first CAS notebook"
license = "GPL-3.0-or-later"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
